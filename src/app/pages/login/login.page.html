<ion-content class="ion-padding">

  <main class="login-container">

    <h1>Abarrotes</h1>
    <h2>El Pedernal</h2>

    <p>Inicia sesión para continuar</p>

    <ion-item>
      <ion-input
        [(ngModel)]="correo"
        name="correo"
        label="Correo"
        labelPlacement="floating"
        type="email"
        inputmode="email"
        autocomplete="email"
        required>
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-input
        [(ngModel)]="password"
        name="password"
        label="Contraseña"
        labelPlacement="floating"
        type="password"
        autocomplete="current-password"
        required>
      </ion-input>
    </ion-item>

    <ion-button
      expand="block"
      class="pedernal-button"
      type="button"
      [disabled]="cargando"
      (click)="login()">
      {{ cargando ? 'Ingresando…' : 'Iniciar sesión' }}
    </ion-button>

  </main>

</ion-content>
