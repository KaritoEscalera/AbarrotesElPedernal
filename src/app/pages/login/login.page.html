<ion-content class="ion-padding">

  <main class="login-container">
    <header class="login-header">
      <img class="login-logo" src="assets/logo-pedernal.png" alt="Abarrotes El Pedernal">
      <span>Administración del negocio</span>
      <h1>Bienvenido</h1>
      <p>Ingresa tus datos para continuar</p>
    </header>

    <ion-item class="password-field">
      <ion-input
        [(ngModel)]="correo"
        name="correo"
        label="Correo"
        labelPlacement="floating"
        type="email"
        inputmode="email"
        autocomplete="email"
        required>
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-input
        [(ngModel)]="password"
        name="password"
        label="Contraseña"
        labelPlacement="floating"
        [type]="mostrarPassword ? 'text' : 'password'"
        autocomplete="current-password"
        required>
      </ion-input>
      <button slot="end" class="password-toggle" type="button" [attr.aria-label]="mostrarPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'" (click)="mostrarPassword = !mostrarPassword">
        <span aria-hidden="true">{{ mostrarPassword ? '◉' : '◌' }}</span>
      </button>
    </ion-item>

    <ion-button
      expand="block"
      class="pedernal-button"
      type="button"
      [disabled]="cargando"
      (click)="login()">
      {{ cargando ? 'Ingresando…' : 'Iniciar sesión' }}
    </ion-button>

    <small class="login-helper">Acceso seguro para personal autorizado</small>

  </main>

</ion-content>
