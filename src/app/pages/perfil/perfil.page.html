<ion-content class="ion-padding"><main><h1>Mi cuenta</h1><ion-card><ion-card-header><ion-card-title>Cambiar contraseña</ion-card-title></ion-card-header><ion-card-content><p class="success" *ngIf="mensaje">{{mensaje}}</p><p class="error" *ngIf="error">{{error}}</p><ion-item><ion-label position="stacked">Contraseña actual</ion-label><ion-input type="password" [(ngModel)]="actual"></ion-input></ion-item><ion-item><ion-label position="stacked">Nueva contraseña</ion-label><ion-input type="password" [(ngModel)]="nueva"></ion-input></ion-item><ion-item><ion-label position="stacked">Confirmar contraseña</ion-label><ion-input type="password" [(ngModel)]="confirmar"></ion-input></ion-item><small>Utiliza al menos 8 caracteres, incluyendo letras y números.</small><ion-button expand="block" [disabled]="guardando" (click)="cambiar()">Actualizar contraseña</ion-button></ion-card-content></ion-card></main></ion-content>
