<ion-content class="ion-padding"><main><header><p>Ventas</p><h1>Promociones</h1><span>Los descuentos se aplican automáticamente en Caja.</span></header><p class="message" *ngIf="mensaje">{{mensaje}}</p><section class="form"><ion-item><ion-label position="stacked">Nombre</ion-label><ion-input [(ngModel)]="form.nombre"></ion-input></ion-item><ion-item><ion-label position="stacked">Producto</ion-label><ion-select [(ngModel)]="form.productoId"><ion-select-option *ngFor="let p of productos" [value]="p.id">{{p.nombre}}</ion-select-option></ion-select></ion-item><ion-item><ion-label position="stacked">Tipo</ion-label><ion-select [(ngModel)]="form.tipo"><ion-select-option value="PORCENTAJE">Porcentaje</ion-select-option><ion-select-option value="PRECIO_ESPECIAL">Precio especial</ion-select-option><ion-select-option value="DOS_POR_UNO">2 × 1</ion-select-option><ion-select-option value="TRES_POR_DOS">3 × 2</ion-select-option></ion-select></ion-item><ion-item *ngIf="form.tipo==='PORCENTAJE'||form.tipo==='PRECIO_ESPECIAL'"><ion-label position="stacked">Valor</ion-label><ion-input type="number" [(ngModel)]="form.valor"></ion-input></ion-item><ion-item><ion-label position="stacked">Inicio</ion-label><ion-input type="datetime-local" [(ngModel)]="form.fechaInicio"></ion-input></ion-item><ion-item><ion-label position="stacked">Fin</ion-label><ion-input type="datetime-local" [(ngModel)]="form.fechaFin"></ion-input></ion-item><ion-button (click)="guardar()">Crear promoción</ion-button></section><section class="list"><article *ngFor="let p of promociones"><div><strong>{{p.nombre}}</strong><small>{{p.producto}} · {{p.tipo}} · hasta {{p.fechaFin|date:'short'}}</small></div><ion-button size="small" [fill]="p.activa?'solid':'outline'" (click)="estado(p)">{{p.activa?'Activa':'Inactiva'}}</ion-button></article></section></main></ion-content>
